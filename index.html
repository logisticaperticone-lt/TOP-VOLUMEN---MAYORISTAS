<title>Top Volumen y Mayoristas · Logística Total</title>
<style>
:root{--bg:#141414;--bg2:#1d1d1d;--bg3:#262626;--line:#343434;--ink:#ececec;--ink2:#b5b5b5;--ink3:#8a8a8a;--acc:#f07a1e;--acc2:#ffa552;--ok:#3fb27f;--warn:#e8b83a;--bad:#e5534b;--blue:#4a9eda}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",system-ui,Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#0d0d0d;border-bottom:3px solid var(--acc)}
header img{height:40px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
header .sub{font-size:11.5px;color:var(--ink3)}
.usr{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink2)}
.usr b{color:#fff}.lk{color:var(--acc2);cursor:pointer;text-decoration:underline}
.adm{background:var(--acc);color:#141414;border-radius:6px;padding:1px 7px;font-weight:700}
#fresh{display:flex;flex-wrap:wrap;gap:6px;padding:7px 18px;background:#111;border-bottom:1px solid var(--line);font-size:11.5px;align-items:center}
.pill{border:1px solid var(--line);border-radius:12px;padding:2px 9px;color:var(--ink2);background:var(--bg2)}
.pill b{color:var(--ink)}
.pill.ok{border-color:#2c6b4f}.pill.ok b{color:var(--ok)}
.pill.warn{border-color:#7a6420}.pill.warn b{color:var(--warn)}
.pill.bad{border-color:#7a2f2b}.pill.bad b{color:var(--bad)}
nav{display:flex;gap:2px;padding:0 18px;background:#111;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;color:var(--ink2);padding:10px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--acc)}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:10px 18px;background:var(--bg2);border-bottom:1px solid var(--line);align-items:flex-end}
.filters label{display:flex;flex-direction:column;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px;gap:3px}
select,input,textarea,button{font:inherit;color:var(--ink);background:var(--bg3);border:1px solid #444;border-radius:6px;padding:5px 8px}
textarea{width:100%;resize:vertical}
button{cursor:pointer}
button.pri{background:var(--acc);color:#141414;border-color:var(--acc);font-weight:700}

<script>
// ===== Lector liviano de .xlsx y .csv (streaming, sin librerías) =====
// Lee archivos grandes (300 MB de XML) fila por fila sin cargar todo en memoria.
// Uso: await leerArchivo(blob, nombre, onHeader(headers) -> false para cortar, onRow(arrayDeValores))
const RD = (() => {
  const td = new TextDecoder('utf-8');
  async function u8(blob, a, b) { return new Uint8Array(await blob.slice(a, b).arrayBuffer()); }
  const le16 = (d, o) => d[o] | (d[o + 1] << 8);
  const le32 = (d, o) => (d[o] | (d[o + 1] << 8) | (d[o + 2] << 16) | (d[o + 3] << 24)) >>> 0;

  async function zipEntries(blob) {
    const n = blob.size, tail = await u8(blob, Math.max(0, n - 66000), n);
    let e = -1;
    for (let i = tail.length - 22; i >= 0; i--) if (le32(tail, i) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('No es un .xlsx válido');
    const cdSize = le32(tail, e + 12), cdOff = le32(tail, e + 16);
    const cd = await u8(blob, cdOff, cdOff + cdSize);
    const out = {};
    for (let p = 0; p < cd.length && le32(cd, p) === 0x02014b50;) {
      const method = le16(cd, p + 10), csize = le32(cd, p + 20), nl = le16(cd, p + 28), xl = le16(cd, p + 30), cl = le16(cd, p + 32), off = le32(cd, p + 42);
      const name = td.decode(cd.subarray(p + 46, p + 46 + nl));
      out[name] = { method, csize, off };
      p += 46 + nl + xl + cl;
    }
    return out;
  }
  async function entryStream(blob, en) {
    const h = await u8(blob, en.off, en.off + 30);
    const start = en.off + 30 + le16(h, 26) + le16(h, 28);
    const s = blob.slice(start, start + en.csize).stream();
    if (en.method === 0) return s;
    return s.pipeThrough(new DecompressionStream('deflate-raw'));
  }
  async function entryText(blob, en) {
    const r = (await entryStream(blob, en)).getReader(), parts = []; const dec = new TextDecoder('utf-8');
    for (;;) { const { value, done } = await r.read(); if (done) break; parts.push(dec.decode(value, { stream: true })); }
    parts.push(dec.decode()); return parts.join('');
  }
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
  const unesc = s => s.indexOf('&') < 0 ? s : s.replace(/&(#x?[0-9a-fA-F]+|\w+);/g, (m, k) =>
    k[0] === '#' ? String.fromCodePoint(k[1] === 'x' ? parseInt(k.slice(2), 16) : +k.slice(1)) : (ENT[k] ?? m));
  function colIdx(ref) { let n = 0; for (let i = 0; i < ref.length; i++) { const c = ref.charCodeAt(i); if (c < 65 || c > 90) break; n = n * 26 + c - 64; } return n - 1; }

  async function leerXlsx(blob, onHeader, onRow) {
    const z = await zipEntries(blob);
    // primera hoja
    const wb = await entryText(blob, z['xl/workbook.xml']);
    const rid = (wb.match(/<sheet\b[^>]*r:id="([^"]+)"/) || [])[1];
    let target = 'xl/worksheets/sheet1.xml';
    if (rid && z['xl/_rels/workbook.xml.rels']) {
      const rels = await entryText(blob, z['xl/_rels/workbook.xml.rels']);
      const m = rels.match(new RegExp('<Relationship\\b[^>]*Id="' + rid + '"[^>]*>')) || [];
      const t = (m[0] || '').match(/Target="([^"]+)"/);
      if (t) target = t[1].startsWith('/') ? t[1].slice(1) : 'xl/' + t[1].replace(/^\.\//, '');

    if (z['xl/sharedStrings.xml']) {
      const ss = await entryText(blob, z['xl/sharedStrings.xml']);
      const re = /<si>([\s\S]*?)<\/si>/g; let m;
      while ((m = re.exec(ss))) { let t = ''; const r2 = /<t\b[^>]*>([^<]*)<\/t>/g; let k; while ((k = r2.exec(m[1]))) t += k[1]; SS.push(unesc(t)); }
    }
    if (!z[target]) throw new Error('No encontré la hoja en el archivo');
    const rd = (await entryStream(blob, z[target])).getReader(); const dec = new TextDecoder('utf-8');
    let buf = '', first = true, stop = false;
    const cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
    function parseRow(x) {
      const row = []; cellRe.lastIndex = 0; let m, pos = 0;
      while ((m = cellRe.exec(x))) {
        const at = m[1], inner = m[2];
        const r = at.match(/\br="([A-Z]+)/); const ci = r ? colIdx(r[1]) : pos; pos = ci + 1;
        if (inner == null) continue;
        const t = (at.match(/\bt="(\w+)"/) || [])[1];
        let v;
        if (t === 'inlineStr') { let s = ''; const r2 = /<t\b[^>]*>([^<]*)<\/t>/g; let k; while ((k = r2.exec(inner))) s += k[1]; v = unesc(s); }
        else {
          const vm = inner.match(/<v>([^<]*)<\/v>/); if (!vm) continue;
          if (t === 's') v = SS[+vm[1]]; else if (t === 'str' || t === 'e') v = unesc(vm[1]); else if (t === 'b') v = vm[1] === '1'; else v = +vm[1];
        }
        row[ci] = v;
      }
      return row;
    }
    for (;;) {
      const { value, done } = await rd.read();
      if (value) buf += dec.decode(value, { stream: true });
      let i = 0, j;
      while ((j = buf.indexOf('</row>', i)) >= 0) {
        const s = buf.indexOf('<row', i);
        const row = parseRow(buf.slice(s, j));
        i = j + 6;
        if (first) { first = false; if (onHeader(row.map(x => x == null ? '' : String(x).trim())) === false) { stop = true; break; } }
        else onRow(row);
      }
      buf = buf.slice(i);
      if (stop) { try { await rd.cancel(); } catch (e) {} break; }
      if (done) break;
    }
  }

  async function leerCsv(blob, onHeader, onRow) {
    const rd = blob.stream().getReader(); const dec = new TextDecoder('utf-8');
    let buf = '', first = true, sep = null, stop = false;
    function parseLines(final) {
      // parser CSV con comillas; procesa filas completas
      let i = 0, row = [], f = '', q = false, start = 0; const n = buf.length; const rows = [];
      for (; i < n; i++) {
        const c = buf[i];
        if (q) { if (c === '"') { if (buf[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
        else if (c === '"') q = true;
        else if (c === sep) { row.push(f); f = ''; }
        else if (c === '\n' || c === '\r') { if (c === '\r' && buf[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; start = i + 1; }
        else f += c;
      }
      if (final && (f !== '' || row.length)) { row.push(f); rows.push(row); start = n; }
      buf = buf.slice(start);
      return rows;
    }
    for (;;) {
      const { value, done } = await rd.read();
      if (value) buf += dec.decode(value, { stream: true });
      if (first && buf.charCodeAt(0) === 0xFEFF) buf = buf.slice(1);
      if (sep == null) { const l = buf.split('\n')[0]; sep = (l.split(';').length > l.split(',').length) ? ';' : ','; }
      for (const r of parseLines(done)) {
        if (r.length === 1 && r[0] === '') continue;
        const vals = r.map(x => { const t = x.trim(); if (t !== '' && /^-?\d+(\.\d+)?$/.test(t)) return +t; return t; });
        if (first) { first = false; if (onHeader(vals.map(x => String(x).trim())) === false) { stop = true; break; } }
        else onRow(vals);
      }
      if (stop) { try { await rd.cancel(); } catch (e) {} break; }
      if (done) break;
    }
  }
  async function leerArchivo(blob, nombre, onHeader, onRow) {
    const ext = (nombre.split('.').pop() || '').toLowerCase();
    if (ext === 'csv' || ext === 'txt') return leerCsv(blob, onHeader, onRow);
    if (ext === 'xlsx' || ext === 'xlsm') return leerXlsx(blob, onHeader, onRow);
    throw new Error('Formato no soportado: .' + ext + ' (guardalo como .xlsx o .csv)');
  }
  async function encabezado(blob, nombre) { let h = null; await leerArchivo(blob, nombre, x => { h = x; return false; }, () => {}); return h || []; }
  // fecha de Excel (número de serie) o texto "dd/mm/aaaa, hh:mm" → Date
  function fecha(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return v;
    if (typeof v === 'number') return new Date(Math.round((v - 25569) * 86400000));
    const m = String(v).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (m) return new Date(Date.UTC(+m[3] < 100 ? 2000 + +m[3] : +m[3], +m[2] - 1, +m[1]));
    const d = new Date(v); return isNaN(d) ? null : d;
  }
  return { leerArchivo, encabezado, fecha };
})();
if (typeof module !== 'undefined') module.exports = RD;

<script>
// ===== Detección de tipo de base y resumen por archivo =====
const AG = (() => {
  const N = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
  const TIPOS = {
    venta: { lab: 'Venta (Base)', req: ['COD. CLIENTE', 'CANTIDADES TOTALES', 'PERIODO', 'CODIGO ARTICULO'] },
    wapi: { lab: 'WAPI (descuentos)', req: ['DESCUENTO $ SOBRE PN SF', 'COD. CLIENTE', 'TOTAL'] },
    clientes: { lab: 'Clientes (Chess)', req: ['CLIENTE', 'RAZON SOCIAL', 'DESCRIPCION SUBCANAL'] },
    activos: { lab: 'Activos fijos (EDF)', req: ['NUMERO DE ACTIVO', 'REPAGA?', 'CLIENTE'] },
    estandar: { lab: 'Estándar de ejecución', req: ['PDV ID', 'SCORE TOTAL', 'TIPO'] },
  };
  function detectar(h) {
    const H = h.map(N);
    for (const [k, t] of Object.entries(TIPOS)) if (t.req.every(r => H.includes(r))) return k;
    return null;
  }
  function ix(h, ...names) { const H = h.map(N); for (const n of names) { const i = H.indexOf(N(n)); if (i >= 0) return i; } return -1; }
  const num = v => typeof v === 'number' ? v : (v == null || v === '' ? 0 : (+String(v).replace(/\./g, '').replace(',', '.') || 0));
  const ymd = d => d ? d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate() : 0;
  const ym = d => d ? d.getUTCFullYear() * 100 + (d.getUTCMonth() + 1) : 0;
  const cod = v => { const s = String(v ?? '').replace(/\D/g, ''); if (!s) return 0; return +(s.length > 8 && s.startsWith('47311200') ? s.slice(8) : s.length > 8 && s.startsWith('473112') ? s.slice(6) : s); };

  // Cada procesador devuelve {onHeader, onRow, fin()}  → fin() = resumen serializable
  const PROC = {
    venta() {
      let c; const agg = new Map(), art = {}; let max = 0, min = 99999999, filas = 0;
      return {
        onHeader(h) { c = { f: ix(h, 'Período'), cli: ix(h, 'Cod. Cliente'), a: ix(h, 'Código articulo'), an: ix(h, 'nombre articulo'), m: ix(h, 'nombre marca'), cal: ix(h, 'Descripción calibre'), un: ix(h, 'Descripción unidad de negocio'), q: ix(h, 'Cantidades Totales'), net: ix(h, 'Importes Netos') }; },
        onRow(r) {
          const d = RD.fecha(r[c.f]); if (!d) return; const cli = cod(r[c.cli]); const a = +r[c.a] || 0; if (!cli || !a) return;
          filas++; const k = ymd(d); if (k > max) max = k; if (k < min) min = k;
          if (!art[a]) art[a] = [String(r[c.an] ?? ''), String(r[c.m] ?? ''), String(r[c.cal] ?? ''), String(r[c.un] ?? '')];
          const kk = ym(d) + '|' + cli + '|' + a;
          let o = agg.get(kk); if (!o) { o = [0, 0]; agg.set(kk, o); }
          o[0] += num(r[c.q]); o[1] += num(r[c.net]);
        },
        fin() {
          const f = []; for (const [k, v] of agg) { const [m, cli, a] = k.split('|'); f.push([+m, +cli, +a, Math.round(v[0] * 1e4) / 1e4, Math.round(v[1])]); }
          return { tipo: 'venta', desde: min, hasta: max, filas, art, f };
        }
      };
    },
    wapi() {
      // Facturación "fila real" (igual que la columna calculada del Power BI):
      // Total / cantidad de filas con el mismo Comprobante + Fecha + Artículo CMQ, + Cantidad Sin Cargo × Precio Neto SF
      let c; const agg = new Map(), grp = new Map(); let max = 0, min = 99999999, filas = 0;
      return {
        onHeader(h) { c = { f: ix(h, 'Fecha'), cli: ix(h, 'Cod. Cliente'), un: ix(h, 'Marca'), tot: ix(h, 'Total'), d: ix(h, 'Descuento $ sobre PN SF'), comp: ix(h, 'Comprobante'), art: ix(h, 'Artículo CMQ', 'Articulo CMQ'), sc: ix(h, 'Cantidad Sin Cargo'), pn: ix(h, 'Precio Neto SF') }; },
        onRow(r) {
          const d = RD.fecha(r[c.f]); const cli = cod(r[c.cli]); if (!d || !cli) return;
          filas++; const k = ymd(d); if (k > max) max = k; if (k < min) min = k;
          const kk = ym(d) + '|' + cli + '|' + String(r[c.un] ?? '');
          let o = agg.get(kk); if (!o) { o = [0, 0]; agg.set(kk, o); }
          o[0] += num(r[c.d]);
          o[1] += num(r[c.sc]) * num(r[c.pn]);
          const g = String(r[c.comp] ?? '') + '|' + k + '|' + String(r[c.art] ?? '');
          let x = grp.get(g); if (!x) { x = [0, 0, kk]; grp.set(g, x); }
          x[0]++; x[1] += num(r[c.tot]);
        },
        fin() {
          for (const [, x] of grp) { const o = agg.get(x[2]); if (o) o[1] += x[1] / x[0]; }
          const f = []; for (const [k, v] of agg) { const [m, cli, un] = k.split('|'); f.push([+m, +cli, un, Math.round(v[0]), Math.round(v[1])]); }
          return { tipo: 'wapi', v: 2, desde: min, hasta: max, filas, f };
        }
      };
    },
    clientes() {
      let c; const L = [];
      return {
        onHeader(h) { c = { cli: ix(h, 'Cliente'), rs: ix(h, 'Razon social'), fan: ix(h, 'Nombre de fantasia'), sub: ix(h, 'Descripcion subcanal'), loc: ix(h, 'Descripcion localidad'), ven: ix(h, 'Fuerza de venta 1 Personal comercial'), venN: ix(h, 'Fuerza de venta 1 Descripcion personal comercial'), ruta: ix(h, 'Fuerza de venta 1 Ruta de venta'), anu: ix(h, 'Anulado'), alta: ix(h, 'Alta fecha'), lista: ix(h, 'Descripcion lista de precios'), pago: ix(h, 'Descripcion forma de pago'), plazo: ix(h, 'Plazo de pago'), lim: ix(h, 'Limite Cr importe'), cm: ix(h, 'Programa COMPORTAMIENTO MAYORISTA'), pot: ix(h, 'Potencial'), dom: ix(h, 'Domicilio') }; },
        onRow(r) {
          const cli = cod(r[c.cli]); if (!cli) return;
          L.push([cli, String(r[c.rs] ?? '').trim(), String(r[c.sub] ?? '').trim(), +r[c.ven] || 0, String(r[c.venN] ?? '').trim(), +r[c.ruta] || 0, N(r[c.anu]) === 'SI' ? 1 : 0,
            ymd(RD.fecha(r[c.alta])), String(r[c.lista] ?? ''), String(r[c.pago] ?? ''), num(r[c.plazo]), num(r[c.lim]), N(r[c.cm]) === 'SI' ? 1 : 0, String(r[c.loc] ?? ''), String(r[c.dom] ?? '')]);
        },
        fin() { return { tipo: 'clientes', filas: L.length, L }; }
      };
    },
    activos() {
      let c; const agg = {}; let filas = 0, max = 0;
      return {
        onHeader(h) { c = { cli: ix(h, 'Cliente'), un: ix(h, 'Unidad de Negocio'), est: ix(h, 'Estado'), rep: ix(h, 'Repaga?'), art: ix(h, 'Descripcion Articulo'), f: ix(h, 'Fecha colocación', 'Fecha colocacion'), vp: ix(h, 'Venta Prom.'), lr: ix(h, 'Litros Repago') }; },
        onRow(r) {
          const cli = cod(r[c.cli]); if (!cli) return; if (c.est >= 0 && N(r[c.est]) !== 'INSTALADO') return;

function filaCliente(c, P) {

// índice de potencial 0..1: momentum de volumen (40%), tendencia de surtido (30%), espacio de share (30%) — percentiles dentro del canal
function potencial(rows, universo) {

    const mom = r.u3mly > 0 ? r.u3m / r.u3mly - 1 : (r.ytdly > 0 ? r.ytd / r.ytdly - 1 : null);
    const bd = r.bdLy > 0 ? r.bdAm / r.bdLy - 1 : (r.bdLm > 0 ? r.bdAm / r.bdLm - 1 : null);

}

}

function calcTop() {

const SORTS = {};
function tabla(id, cols, rows, opts = {}) {
  const st = SORTS[id]; let rs = rows.slice();
  if (st) { const c = cols[st.i]; if (c && c.sv) rs.sort((a, b) => { const x = c.sv(a) ?? -Infinity, y = c.sv(b) ?? -Infinity; return (x < y ? -1 : x > y ? 1 : 0) * st.d; }); }
  const g = opts.groups ? `<tr>${opts.groups.map(x => `<th class="grp" colspan="${x[1]}">${esc(x[0])}</th>`).join('')}</tr>` : '';
  const head = `<tr class="${opts.groups ? 'grp2' : ''}">${cols.map((c, i) => `<th class="${c.l ? 'l' : ''} ${c.bl ? 'bl' : ''}" ${c.sv ? `onclick="ordenar('${id}',${i})"` : ''} title="${esc(c.tt || '')}">${c.lab}${st && st.i === i ? (st.d > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr>`;
  const body = rs.map(r => `<tr class="${r._cls || ''}">${cols.map(c => `<td class="${c.l ? 'l' : ''} ${c.bl ? 'bl' : ''} ${c.cls ? (typeof c.cls === 'function' ? c.cls(r) : c.cls) : ''}">${c.fn(r)}</td>`).join('')}</tr>`).join('');
  return `<div class="tw" ${opts.h ? `style="max-height:${opts.h}"` : ''}><table id="${id}"><thead>${g}${head}</thead><tbody>${body || `<tr><td class="l mut" colspan="${cols.length}">Sin filas</td></tr>`}</tbody></table></div>`;
}
function ordenar(id, i) { const s = SORTS[id]; SORTS[id] = s && s.i === i ? { i, d: -s.d } : { i, d: -1 }; render(); }

async function permiso(h) { if (!h) return false; if ((await h.queryPermission({ mode: 'read' })) === 'granted') return true; return (await h.requestPermission({ mode: 'read' })) === 'granted'; }
async function listarCarpeta(detectar) {
  if (!DIR || !(await permiso(DIR))) return false;
  const out = [];
  async function rec(d, pre, depth) {
    for await (const [name, h] of d.entries()) {
      if (h.kind === 'directory') { if (depth < 2 && !name.startsWith('.')) await rec(h, pre + name + '/', depth + 1); continue; }
      if (!/\.(xlsx|xlsm|csv)$/i.test(name) || name.startsWith('~$')) continue;
      const f = await h.getFile(); out.push({ path: pre + name, name, h, size: f.size, mod: f.lastModified });
    }
  }
  if ($('pubMsg')) $('pubMsg').textContent = 'Leyendo carpeta…';
  await rec(DIR, '', 0);
  out.sort((a, b) => a.path.localeCompare(b.path));
  FILES = out; await detectarTipos(); if (detectar !== false) render();
  return true;
}
async function actualizar() {
  if (DIR) { if (!(await listarCarpeta(false))) return; render(); }
  await procesarYPublicar();

async function archivosSueltos(fl) {
  FILES = [...fl].map(f => ({ path: f.name, name: f.name, file: f, size: f.size, mod: f.lastModified }));
  FILES.forEach(f => { if (SEL[f.path] === undefined) SEL[f.path] = true; });
  await detectarTipos(); render();
}
async function detectarTipos() {
  const cache = (await IDB.get('det')) || {};
  for (const f of FILES) {
    const k = f.path + '|' + f.size + '|' + f.mod;
    if (cache[k] !== undefined) f.det = cache[k];
    else { try { const file = f.file || await f.h.getFile(); f.det = AG.detectar(await RD.encabezado(file, f.name)); } catch (e) { f.det = null; f.est = 'no se pudo leer'; } cache[k] = f.det; }
    if (SEL[f.path] === undefined) SEL[f.path] = !!f.det;
  }
  await IDB.set('det', cache); await guardarSel();
}

async function procesarYPublicar() {
  const msg = $('pubMsg'), bar = $('pubBar'); $('btnPub').disabled = true;

    const cache = (await IDB.get('res')) || {}; const R = [];
    let i = 0;
    for (const f of usar) {

      R.push({ ...r, n: f.path, mod: f.mod });
    }
    // limpiar caché de archivos viejos

// une los resúmenes de cada archivo: para cada mes de venta / WAPI usa un solo archivo (el más nuevo)
function unir(R) {
  const avisos = [];
  const pickMes = (tipo) => {
    const own = new Map();
    for (const r of R.filter(x => x.tipo === tipo)) { const ms = new Set(r.f.map(x => x[0])); for (const m of ms) { const o = own.get(m); if (!o || r.hasta > o.hasta || (r.hasta === o.hasta && r.mod > o.mod)) { if (o) avisos.push(`${ymLab(m)} está en "${o.n}" y en "${r.n}": uso "${r.n}".`); own.set(m, r); } else avisos.push(`${ymLab(m)} está en "${o.n}" y en "${r.n}": uso "${o.n}".`); } }
    return own;
  };
  const art = {}; const v = [];
  const ownV = pickMes('venta');
  for (const r of R.filter(x => x.tipo === 'venta')) { Object.assign(art, r.art); for (const x of r.f) if (ownV.get(x[0]) === r) v.push([x[0], x[1], x[2], x[3]]); }
  const ownW = pickMes('wapi'); const w = [];
  for (const r of R.filter(x => x.tipo === 'wapi')) for (const x of r.f) if (ownW.get(x[0]) === r) w.push(x);
  const last = t => R.filter(x => x.tipo === t).sort((a, b) => b.mod - a.mod)[0];
  const cl = last('clientes'), ac = last('activos');
  if (R.filter(x => x.tipo === 'clientes').length > 1) avisos.push('Hay más de una base de Clientes: uso la más nueva (' + cl.n + ').');
  const est = []; const seen = new Set();
  for (const r of R.filter(x => x.tipo === 'estandar')) for (const x of r.L) { const k = x[0] + '|' + x[1] + '|' + x[2]; if (!seen.has(k)) { seen.add(k); est.push(x); } }
  const rng = t => { const rs = R.filter(x => x.tipo === t && x.hasta); if (!rs.length) return null; return { desde: Math.min(...rs.map(x => x.desde || x.hasta)), hasta: Math.max(...rs.map(x => x.hasta)) }; };
  const ymdOf = ms => { const d = new Date(ms); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
  // meses faltantes
  const ms = [...ownV.keys()].sort((a, b) => a - b);
  if (ms.length) for (let m = ms[0]; m < ms[ms.length - 1]; m = ymAdd(m, 1)) if (!ownV.has(m)) avisos.push(`Falta la venta de ${ymLab(m)}.`);
  const meta = {
    venta: rng('venta'), wapi: rng('wapi'), estandar: rng('estandar'),
    clientes: cl ? { mod: ymdOf(cl.mod), n: cl.n } : null, activos: ac ? { mod: ymdOf(ac.mod), hasta: ac.hasta, n: ac.n } : null,
    archivos: R.map(r => ({ n: r.n, t: r.tipo })), avisos
  };
  if (!rng('wapi')) avisos.push('No marcaste ningún WAPI: el Trade Spend va a quedar vacío.');
  if (!ac) avisos.push('Falta Activos fijos: EDF vacío.');
  if (!est.length) avisos.push('Falta Estándar de ejecución.');
  return { data: { art, v, w, cli: cl ? cl.L : [], edf: ac ? ac.agg : {}, est }, meta };
}

async function loginAdmin() {
  const pin = await fbGet('admin/pin');
  if (pin && lsGet('gx_pin') === pin) return true;
  const p = prompt(pin ? 'PIN de administrador:' : 'Creá un PIN de administrador (mínimo 4 caracteres):'); if (!p) return false;
  const h = await sha(p);
  if (!pin) { if (p.length < 4) { alert('Muy corto'); return false; } await ref('admin/pin').set(h); lsSet('gx_pin', h); return true; }
  if (h === pin) { lsSet('gx_pin', h); return true; }
  alert('PIN incorrecto'); return false;
}
async function cargarDatos() {
  const meta = await fbGet('meta'); META = meta;
  if (!meta) return;
  const loc = await IDB.get('data');
  if (loc && loc.ver === meta.ver) { DATA = loc.data; return; }
  $('boot') && ($('boot').firstChild.textContent = `Descargando datos (${nf0.format(meta.kb || 0)} KB)…`);
  const raw = await fbGet('data');
  DATA = JSON.parse(await gunz(unb64(juntar(raw))));
  await IDB.set('data', { ver: meta.ver, data: DATA });
}
async function boot() {
  try {
    await fbInit(); $('bootBar').style.width = '20%';
    if (ADMIN && !(await loginAdmin())) { location.hash = ''; location.reload(); return; }
    const cfg = await fbGet('cfg'); if (cfg) CFG = Object.assign(JSON.parse(JSON.stringify(CFG_DEF)), typeof cfg === 'string' ? JSON.parse(cfg) : cfg);
    $('bootBar').style.width = '35%';
    await cargarDatos(); $('bootBar').style.width = '80%';
    if (DATA) preparar();
    const s = await IDB.get('sel'); if (s) { SEL = s.SEL || {}; TIPOSEL = s.TIPOSEL || {}; }
    if (ADMIN) { DIR = await IDB.get('dir') || null; }
    S.tab = DATA ? 'top' : (ADMIN ? 'carga' : 'info');
    render();
    if (!USER) pedirUsuario();
    // en vivo: PDA, topes, autorizaciones, configuración, publicación nueva
    ref('pda').on('value', s => { PDA = s.val() || {}; if (DATA && !$('dlg').open) render(); });
    ref('topes').on('value', s => { TOPES = s.val() || {}; if (DATA && !$('dlg').open) render(); });
    ref('aut').on('value', s => { AUT = s.val() || {}; if (DATA && !$('dlg').open) render(); });
    ref('cfg').on('value', s => { const v = s.val(); if (!v) return; const n = Object.assign(JSON.parse(JSON.stringify(CFG_DEF)), typeof v === 'string' ? JSON.parse(v) : v); const re = JSON.stringify(n.sub) !== JSON.stringify(CFG.sub) || JSON.stringify(n.ven) !== JSON.stringify(CFG.ven) || JSON.stringify(n.grupo) !== JSON.stringify(CFG.grupo); CFG = n; if (DATA && re) preparar(); if (!$('dlg').open) render(); });
    ref('meta/ver').on('value', s => { const v = s.val(); if (META && v && v !== META.ver && !ADMIN) { const b = document.createElement('div'); b.className = 'err'; b.style.background = '#7a4a10'; b.innerHTML = 'Hay datos nuevos publicados. <button onclick="location.reload()">Actualizar</button>'; document.body.insertBefore(b, $('nav')); } });
    CENSO = await cargarCenso(); renderFresh(); if (DATA && ['top', 'cm', 'ficha'].includes(S.tab) && !$('dlg').open) render();
  } catch (e) {
    console.error(e); $('main').innerHTML = `<div class="err">No se pudo iniciar: ${esc(e.message || e)} — mandale una captura a Ivo.</div>`;
  }
}
$('dlg').addEventListener('close', () => { if (DATA) render(); });
window.addEventListener('hashchange', () => location.reload());
boot();
